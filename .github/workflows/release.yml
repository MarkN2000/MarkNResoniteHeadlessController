name: release

# タグ push（v*）でリリース資産をビルド・添付。手動実行(workflow_dispatch)でも全ターゲットをビルドして
# アーティファクトとして確認できる。
#
# 配布形態（R-E）: Linux=tar.gz / Windows=zip。中身はトップレベルフォルダ mrhc-<os>-<arch>/
# （mrhc 本体＋README＋LICENSE）。tar は実行権を保持する（chmod +x 案内を不要にする）。
# アセット名にバージョンを含めない＝ releases/latest/download/ の固定リンクが常に最新安定版を指す。
on:
  push:
    tags:
      - 'v[0-9]*' # バージョンタグのみ（v始まりの非バージョンタグで誤発火しない）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: '.exe' }
          - { goos: linux,   goarch: amd64, ext: ''     }
          - { goos: linux,   goarch: arm64, ext: ''     } # ARM Linux（Resonite が ARM で動く環境向け）
    steps:
      - uses: actions/checkout@v4

      # --- フロントエンド（web/dist を生成 → Go が embed.FS で同梱する。go build より前に必須）---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit signatures
          npm audit --audit-level=high
          npm run build

      # --- バックエンド（CGO 不要の純 Go。GOOS/GOARCH を変えるだけでクロスビルド可）---
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # version はタグ push 時はタグ名（例 v2.0.0）、workflow_dispatch 時はブランチ名が入る
        # （開発ビルドの目印として有用）。
        run: |
          mkdir -p "stage/mrhc-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "stage/mrhc-${GOOS}-${GOARCH}/mrhc${{ matrix.ext }}" ./cmd/mrhc

      # --- アーカイブ化: トップレベルフォルダごと tar.gz(Linux) / zip(Windows) に固める ---
      - name: Package archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          name="mrhc-${GOOS}-${GOARCH}"
          cp README.md LICENSE "stage/${name}/"
          mkdir -p dist
          if [ "${GOOS}" = "windows" ]; then
            (cd stage && zip -qr "../dist/${name}.zip" "${name}")
            echo "ARTIFACT=dist/${name}.zip" >> "$GITHUB_ENV"
          else
            # --owner/--group: runner の uid/ユーザー名をアーカイブに残さない（sudo 展開時の事故防止）
            tar --owner=0 --group=0 --numeric-owner -czf "dist/${name}.tar.gz" -C stage "${name}"
            echo "ARTIFACT=dist/${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrhc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  # タグでの実行（push・またはタグ ref を選んだ手動実行＝リリース再添付の手段）のときだけ、
  # 全ターゲットのアーカイブ＋SHA256SUMS＋install.sh を 1 つのリリースにまとめて添付する
  # （needs: build = 1 ターゲットでも失敗したら走らない＝不完全リリース防止）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリース作成・資産アップロードに必要
    steps:
      - uses: actions/checkout@v4 # install.sh（タグ時点のもの）を添付するため

      - uses: actions/download-artifact@v4
        with:
          pattern: mrhc-*
          path: dist
          merge-multiple: true

      # ファイル名を明示列挙（パスプレフィックス無し）→ ユーザー側で sha256sum -c がそのまま通る
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum mrhc-linux-amd64.tar.gz mrhc-linux-arm64.tar.gz mrhc-windows-amd64.zip > SHA256SUMS

      - name: Create release (draft)
        uses: softprops/action-gh-release@v2
        with:
          # draft で作成し、全アセットが揃ってから下のステップで公開する。
          # 公開済みリリースへ逐次アップロードすると、releases/latest が新タグを指すのに
          # アセットがまだ無い数十秒〜数分の窓ができ、自己更新（selfupdate）や install.sh が
          # 404 を踏む。draft は /latest に出ないため窓が消える。
          draft: true
          # セマンティックバージョンのプレリリースタグ（v2.0.0-rc.1 等・「-」を含む）は prerelease
          # として公開 → releases/latest の固定リンク（install.sh / 自己更新の取得先）を汚さない。
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true # タグ間のコミット一覧からリリースノートを自動生成
          fail_on_unmatched_files: true
          files: |
            dist/mrhc-linux-amd64.tar.gz
            dist/mrhc-linux-arm64.tar.gz
            dist/mrhc-windows-amd64.zip
            dist/SHA256SUMS
            install.sh

      # 全アセット添付済みの draft を公開（この時点で初めて /latest が新タグを指す）。
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

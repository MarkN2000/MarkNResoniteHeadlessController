<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRHC Go PoC</title>
<style>
  body { font-family: ui-monospace, monospace; margin: 1rem; background: #111; color: #ddd; }
  h3 { margin: 0 0 .5rem; }
  #log { white-space: pre-wrap; background: #000; padding: .5rem; height: 70vh;
         overflow: auto; border: 1px solid #333; border-radius: 4px; font-size: 13px; }
  form { margin-top: .5rem; display: flex; gap: .5rem; }
  input { flex: 1; padding: .4rem; background: #000; color: #ddd; border: 1px solid #333; }
  button { padding: .4rem .8rem; }
</style>
</head>
<body>
  <h3>MRHC Go PoC — embed.FS + SSE + subprocess I/O</h3>
  <div id="log"></div>
  <form id="f">
    <input id="c" placeholder="コマンド入力 (例: worlds) → Enterで送信" autocomplete="off">
    <button type="submit">send</button>
  </form>
  <script>
    const log = document.getElementById('log');
    function add(t) {
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 5;
      log.textContent += t + "\n";
      if (atBottom) log.scrollTop = log.scrollHeight;
    }
    const es = new EventSource('/events');
    es.onmessage = (e) => add(e.data);
    es.onerror = () => add('[poc] SSE disconnected');
    document.getElementById('f').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const input = document.getElementById('c');
      const c = input.value.trim();
      if (!c) return;
      fetch('/command?cmd=' + encodeURIComponent(c), { method: 'POST' });
      input.value = '';
    });
  </script>
</body>
</html>

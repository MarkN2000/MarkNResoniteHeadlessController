<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRHC</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; background: #0f0f12; color: #e5e5ea; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 1rem; }
  h2 { margin: .2rem 0 1rem; }
  input, button { font: inherit; padding: .5rem .7rem; border-radius: 6px; border: 1px solid #333; background: #16161c; color: #e5e5ea; }
  button { cursor: pointer; }
  button:hover { background: #22222b; }
  .bar { display: flex; gap: .5rem; align-items: center; margin-bottom: .6rem; flex-wrap: wrap; }
  .bar .grow { flex: 1; }
  .badge { padding: .25rem .6rem; border-radius: 999px; font-size: .85rem; border: 1px solid #333; }
  .badge.running { background: #103a1a; border-color: #1f7a37; }
  .badge.stopped { background: #3a1010; border-color: #7a1f1f; }
  #log { white-space: pre-wrap; background: #000; border: 1px solid #2a2a32; border-radius: 6px;
         padding: .6rem; height: 64vh; overflow: auto; font: 13px ui-monospace, monospace; }
  #log .err { color: #ff8585; }
  #log .sys { color: #8fb6ff; }
  #log .cmd { color: #b6ff8f; }
  #cmdForm { display: flex; gap: .5rem; margin-top: .5rem; }
  #cmdForm input { flex: 1; }
  #loginErr { color: #ff8585; margin-top: .5rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <section id="login">
    <h2>MRHC ログイン</h2>
    <div class="bar">
      <input id="pw" type="password" placeholder="管理パスワード" class="grow">
      <button id="loginBtn">ログイン</button>
    </div>
    <div id="loginErr"></div>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <span id="state" class="badge">-</span>
      <span class="grow"></span>
      <button id="startBtn">起動</button>
      <button id="stopBtn">停止</button>
      <button id="logoutBtn">ログアウト</button>
    </div>
    <div id="log"></div>
    <form id="cmdForm">
      <input id="cmd" placeholder="コマンド (例: worlds)" autocomplete="off">
      <button type="submit">送信</button>
    </form>
  </section>
</div>

<script>
const API = '/api/v1';
const $ = (id) => document.getElementById(id);
let es = null;

async function api(path, opts = {}) {
  return fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
}

function setState(st) {
  const el = $('state');
  const s = st && st.state ? st.state : '-';
  el.textContent = 'state: ' + s + (st && st.ready ? ' (ready)' : '') + (st && st.pid ? ' pid:' + st.pid : '');
  el.className = 'badge ' + (s === 'running' ? 'running' : (s === 'stopped' ? 'stopped' : ''));
}

function addLog(line) {
  const log = $('log');
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 5;
  const div = document.createElement('div');
  div.className = line.kind || '';
  div.textContent = line.text;
  log.appendChild(div);
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function connectSSE() {
  if (es) es.close();
  es = new EventSource(API + '/events');
  es.addEventListener('log', (e) => addLog(JSON.parse(e.data)));
  es.addEventListener('status', (e) => setState(JSON.parse(e.data)));
}

function showApp() {
  $('login').hidden = true;
  $('app').hidden = false;
  $('log').textContent = '';
  connectSSE();
}

async function doLogin() {
  $('loginErr').textContent = '';
  const r = await api('/login', { method: 'POST', body: JSON.stringify({ password: $('pw').value }) });
  if (r.ok) { $('pw').value = ''; showApp(); }
  else { $('loginErr').textContent = 'ログインに失敗しました'; }
}

$('loginBtn').addEventListener('click', doLogin);
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('startBtn').addEventListener('click', () => api('/start', { method: 'POST', body: '{}' }));
$('stopBtn').addEventListener('click', () => api('/stop', { method: 'POST' }));
$('logoutBtn').addEventListener('click', async () => {
  await api('/logout', { method: 'POST' });
  if (es) es.close();
  $('app').hidden = true;
  $('login').hidden = false;
});
$('cmdForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const c = $('cmd').value.trim();
  if (!c) return;
  api('/command', { method: 'POST', body: JSON.stringify({ cmd: c }) });
  $('cmd').value = '';
});

// 既存セッションがあればアプリ画面へ
api('/status').then((r) => { if (r.ok) showApp(); });
</script>
</body>
</html>
